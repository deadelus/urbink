name: Deploy iOS Prod → App Store

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches-ignore:
      - '**'

jobs:
  ios-appstore-prod:
    name: Build iOS prod + Upload App Store
    runs-on: macos-15
    timeout-minutes: 90
    environment: ios-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: urbink/ios

      - name: Créer firebase_options.dart depuis le secret
        working-directory: urbink
        env:
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS }}
        run: echo "$FIREBASE_OPTIONS" > lib/firebase_options.dart

      - name: Créer GoogleService-Info.plist depuis le secret
        working-directory: urbink
        env:
          GOOGLE_SERVICE_INFO: ${{ secrets.GOOGLE_SERVICE_INFO }}
        run: echo "$GOOGLE_SERVICE_INFO" > ios/Runner/GoogleService-Info.plist

      - name: Install Flutter dependencies
        working-directory: urbink
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: urbink/ios
        run: pod install

      - name: Build & Upload via Fastlane (lane production)
        working-directory: urbink/ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          FLUTTER_BUILD_TAG: ${{ github.ref_name }}
        run: bundle exec fastlane production
