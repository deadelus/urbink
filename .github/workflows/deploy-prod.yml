name: Deploy Prod → App Store

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    # Exclure les tags -beta pour ne pas déclencher en même temps que staging
    branches-ignore:
      - '**'

jobs:
  appstore-prod:
    name: Build prod + Upload App Store
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: urbink/ios

      - name: Créer firebase_options_prod.dart depuis le secret
        working-directory: urbink
        env:
          FIREBASE_OPTIONS_PROD: ${{ secrets.FIREBASE_OPTIONS_PROD }}
        run: echo "$FIREBASE_OPTIONS_PROD" > lib/firebase_options_prod.dart

      - name: Install Flutter dependencies
        working-directory: urbink
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: urbink/ios
        run: pod install

      - name: Build & Upload via Fastlane (lane production)
        working-directory: urbink/ios
        env:
          PROD_APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.PROD_APP_STORE_CONNECT_API_KEY_ID }}
          PROD_APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.PROD_APP_STORE_CONNECT_API_ISSUER_ID }}
          PROD_APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.PROD_APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          FLUTTER_BUILD_TAG: ${{ github.ref_name }}
        run: bundle exec fastlane production
