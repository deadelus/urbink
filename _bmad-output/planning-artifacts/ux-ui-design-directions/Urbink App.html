<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urbink — App complète</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0D1117; font-family: 'Inter', sans-serif; overflow: hidden; }
#root { width: 100vw; height: 100vh; }
button { font-family: inherit; }

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
@keyframes fall {
  0%   { transform: translateY(0) rotate(0deg);   opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
@keyframes badgePop {
  0%   { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1);   opacity: 1; }
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: .6; transform: scale(1.2); }
}

::-webkit-scrollbar { display: none; }
* { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Load component files in dependency order -->
<script type="text/babel" src="js/shared.jsx"></script>
<script type="text/babel" src="js/i18n.jsx"></script>
<script type="text/babel" src="js/MapView.jsx"></script>
<script type="text/babel" src="js/CarteScreen.jsx"></script>
<script type="text/babel" src="js/Screens.jsx"></script>
<script type="text/babel" src="js/Overlays.jsx"></script>
<script type="text/babel" src="js/SettingsScreen.jsx"></script>
<script type="text/babel" src="js/CityScreen.jsx"></script>

<!-- Root app (must be last) -->
<script type="text/babel">
'use strict';
// Make React available to all scripts
window.React = React;
window.ReactDOM = ReactDOM;
</script>
<script type="text/babel" src="js/App.jsx"></script>

</body>
</html>
