<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Médailles Gravées · Planche · Monuments de Paris</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0806; --panel:#120e0a; --ink:#f5e9d0; --ink-dim:#8b7a5a; --ink-mute:#5a4d36; --rule:#1f1810;
    --gold-1:oklch(94% 0.10 90); --gold-2:oklch(82% 0.14 82); --gold-3:oklch(64% 0.13 72); --gold-4:oklch(40% 0.09 60);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",serif;}
  body{
    background:radial-gradient(1200px 800px at 30% -10%, oklch(22% 0.05 70 / .25), transparent 60%), var(--bg);
    min-height:100vh;
  }
  .frame{ max-width:1480px; margin:0 auto; padding:56px 48px 88px; }
  header.masthead{
    display:grid; grid-template-columns:minmax(0,1fr) auto; gap:40px;
    align-items:end; border-bottom:1px solid var(--rule); padding-bottom:24px; margin-bottom:48px;
  }
  header.masthead > div:first-child{ min-width:0; }
  .eyebrow{
    font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--ink-dim); margin:0 0 14px; display:flex; align-items:center; gap:14px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold-2);box-shadow:0 0 10px var(--gold-2);}
  h1{
    font-weight:400; font-family:"Cinzel",serif; font-size:clamp(40px,5vw,76px); line-height:.96;
    letter-spacing:.02em; margin:0;
    background:linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 50%, var(--gold-3) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  h1 em{font-style:italic;font-family:"Cormorant Garamond",serif;font-weight:500;color:var(--ink-dim);-webkit-text-fill-color:var(--ink-dim);}
  .meta{ font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-dim); text-align:right; line-height:1.7;}
  .meta b{color:var(--ink);font-weight:500;}
  @media (max-width:1100px){ header.masthead{grid-template-columns:1fr;align-items:start;gap:18px;} .meta{text-align:left;} }
  .grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
    background:var(--rule); border:1px solid var(--rule);
  }
  @media (max-width:1100px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:780px){  .grid{grid-template-columns:repeat(2,1fr);} }
  .cell{
    background:var(--panel); aspect-ratio:1/1; position:relative; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .cell::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(120% 80% at 50% 110%, oklch(28% 0.06 65 / .45), transparent 60%),
      linear-gradient(180deg, oklch(14% 0.02 60) 0%, oklch(8% 0.015 50) 100%);
  }
  .tick{position:absolute;width:9px;height:9px;border-color:var(--gold-4);border-style:solid;border-width:0;z-index:3;}
  .tick.tl{top:10px;left:10px;border-top-width:1px;border-left-width:1px;}
  .tick.tr{top:10px;right:10px;border-top-width:1px;border-right-width:1px;}
  .tick.bl{bottom:10px;left:10px;border-bottom-width:1px;border-left-width:1px;}
  .tick.br{bottom:10px;right:10px;border-bottom-width:1px;border-right-width:1px;}
  .id{position:absolute;top:14px;left:18px;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.18em;color:var(--ink-mute);z-index:4;text-transform:uppercase;}
  .arr{position:absolute;top:14px;right:18px;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.16em;color:var(--gold-3);z-index:4;}
  .stage{flex:1;position:relative;z-index:2;display:grid;place-items:center;padding:28px 18px 8px;}
  .stage svg.medal{width:88%;max-width:280px;height:auto;filter: drop-shadow(0 12px 30px oklch(70% 0.13 75 / .18));}
  .label{
    position:relative;z-index:3;padding:14px 20px 18px;
    border-top:1px solid oklch(20% 0.02 60 / .6);
    background: linear-gradient(180deg, transparent, oklch(8% 0.015 50 / .6));
    text-align:center;
  }
  .label .name{font-family:"Cinzel",serif;font-weight:500;font-size:13.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-1);margin:0 0 4px;text-wrap:balance;}
  .label .sub{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-mute);}
  .label .sub b{color:var(--gold-3);font-weight:500;}
  footer.foot{
    margin-top:48px;padding-top:24px;border-top:1px solid var(--rule);
    display:flex;justify-content:space-between;
    font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-mute);letter-spacing:.16em;text-transform:uppercase;
  }
  footer.foot b{color:var(--gold-3);font-weight:500;}
</style>
</head>
<body>
<div class="frame">
  <header class="masthead">
    <div>
      <p class="eyebrow"><span class="dot"></span>Planche · Médailles Gravées · 16/16</p>
      <h1>Médailles<br><em>de Paris</em></h1>
    </div>
    <div class="meta">
      <div>STYLE · <b>frappe gravée double cercle</b></div>
      <div>METAL · <b>or · oklch</b></div>
      <div>FORMAT · <b>1:1 · vector</b></div>
      <div>PIECES · <b>16 monuments</b></div>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <footer class="foot">
    <span>Urbink · Atlas Médailles</span>
    <span><b>16</b> pièces · <b>SVG</b> · <b>cinzel + cormorant</b></span>
    <span>v.02 · 2026</span>
  </footer>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="oklch(96% 0.10 90)"/>
      <stop offset=".45" stop-color="oklch(80% 0.14 80)"/>
      <stop offset=".7"  stop-color="oklch(55% 0.12 65)"/>
      <stop offset="1"   stop-color="oklch(34% 0.08 55)"/>
    </linearGradient>
    <radialGradient id="field" cx=".4" cy=".35" r=".85">
      <stop offset="0"   stop-color="oklch(86% 0.12 84)"/>
      <stop offset=".55" stop-color="oklch(68% 0.13 74)"/>
      <stop offset="1"   stop-color="oklch(38% 0.09 60)"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="oklch(28% 0.07 55)"/>
      <stop offset="1" stop-color="oklch(18% 0.04 50)"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="oklch(98% 0.06 90)"/>
      <stop offset="1" stop-color="oklch(82% 0.13 80)"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="oklch(55% 0.10 65)"/>
      <stop offset="1" stop-color="oklch(28% 0.07 55)"/>
    </linearGradient>
    <pattern id="hatchV" width="1.2" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="3" stroke="oklch(28% 0.07 55)" stroke-width=".55" opacity=".55"/>
    </pattern>
    <pattern id="hatchD" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="2" stroke="oklch(28% 0.07 55)" stroke-width=".5" opacity=".55"/>
    </pattern>
  </defs>
</svg>

<script>
const I = "url(#ink)";
const S = "url(#sh)";
const H = "url(#hi)";
const HV = "url(#hatchV)";
const HD = "url(#hatchD)";

const monuments = [
  {id:"01", arr:"VII",  name:"Tour Eiffel",            yr:"1889", k:"eiffel"},
  {id:"02", arr:"I",    name:"Palais du Louvre",       yr:"1546", k:"louvre"},
  {id:"03", arr:"IV",   name:"Notre-Dame",             yr:"1163", k:"notredame"},

  {id:"05", arr:"I",    name:"Colonne Vendôme",        yr:"1810", k:"vendome"},
  {id:"06", arr:"V",    name:"Panthéon",               yr:"1790", k:"pantheon"},
  {id:"07", arr:"XVIII",name:"Sacré-Cœur",             yr:"1914", k:"sacrecoeur"},
  {id:"08", arr:"I",    name:"Conciergerie",           yr:"XIVe", k:"conciergerie"},
  {id:"09", arr:"IV",   name:"Colonne de Juillet",     yr:"1840", k:"juillet"},
  {id:"10", arr:"XII",  name:"Château de Vincennes",   yr:"XIVe", k:"vincennes"},
  {id:"11", arr:"VIII", name:"Palais de l'Élysée",     yr:"1722", k:"elysee"},
  {id:"12", arr:"IX",   name:"Opéra Garnier",          yr:"1875", k:"opera"},
  {id:"13", arr:"I",    name:"Sainte-Chapelle",        yr:"1248", k:"saintechapelle"},
  {id:"14", arr:"VII",  name:"Hôtel des Invalides",    yr:"1706", k:"invalides"},
  {id:"15", arr:"IV",   name:"Tour Saint-Jacques",     yr:"1523", k:"stjacques"},
  {id:"16", arr:"I",    name:"Palais-Royal",           yr:"1639", k:"palaisroyal"},
];

// ===== ENGRAVING HELPERS =====
// Diagonal hatching for shadow side of a rectangle.
function hatch(x,y,w,h,step=1.6,dir=1){
  const out=[];
  // Cover with diagonal lines clipped via path
  const gx=`hx-${Math.random().toString(36).slice(2,8)}`;
  out.push(`<defs><clipPath id="${gx}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath></defs>`);
  const len = w+h;
  for(let i=-h;i<w+h;i+=step){
    const x1 = dir>0 ? x+i : x+i;
    const y1 = dir>0 ? y   : y+h;
    const x2 = dir>0 ? x+i+h : x+i+h;
    const y2 = dir>0 ? y+h   : y;
    out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${I}" stroke-width=".35" opacity=".7" clip-path="url(#${gx})"/>`);
  }
  return out.join("");
}

      <!-- platforms -->

      <!-- lattice (horizontal courses) -->
      <line x1="34" y1="55" x2="66" y2="55" stroke-width=".3" stroke-dasharray="1 1"/>
      <line x1="36" y1="50" x2="64" y2="50" stroke-width=".3" stroke-dasharray="1 1"/>
      <line x1="38" y1="46" x2="62" y2="46" stroke-width=".3" stroke-dasharray="1 1"/>
      <!-- diagonal lattice X's -->
      <path d="M 38 60 L 50 42 L 38 60 M 62 60 L 50 42 L 62 60" stroke-width=".35"/>
      <path d="M 38 58 L 62 60 M 38 60 L 62 58" stroke-width=".25"/>
      <!-- top mast -->
      <path d="M 46 42 L 50 24 L 54 42" stroke-width=".5"/>
      <path d="M 48 42 L 50 24 L 52 42" stroke-width=".35"/>
      <line x1="50" y1="24" x2="50" y2="10" stroke-width=".55"/>
      <circle cx="50" cy="9" r="1.2" stroke-width=".4"/>
      <line x1="50" y1="8" x2="50" y2="4" stroke-width=".4"/>
      <!-- pennant -->
      <path d="M 50 4 L 56 5 L 53 7 L 56 9 L 50 10" stroke-width=".4"/>
    </g>
    <!-- shadow side hatching -->
    <g stroke="${I}" stroke-width=".3" opacity=".65">
      ${Array.from({length:14}).map((_,i)=>`<line x1="${52+i*1.8}" y1="${44+i*3}" x2="${56+i*1.8}" y2="${44+i*3}"/>`).join("")}
    </g>`,
  louvre: `
    <g stroke="${I}" fill="none" stroke-linecap="round">
      ${Array.from({length:18}).map((_,i)=>`<line x1="${10+i*4.5}" y1="93" x2="${14+i*4.5}" y2="96" stroke-width=".4"/>`).join("")}
      <line x1="6" y1="92" x2="94" y2="92" stroke-width=".8"/>
      <!-- pavilion wings (left + right) — arched windows -->

      <!-- arched windows on wings -->
      ${[12,20,28,68,76,84].map(x=>`<path d="M ${x} 88 L ${x} 72 Q ${x} 67 ${x+3.5} 67 Q ${x+7} 67 ${x+7} 72 L ${x+7} 88 Z" stroke-width=".4"/><line x1="${x+3.5}" y1="67" x2="${x+3.5}" y2="88" stroke-width=".25" stroke-dasharray="1 1"/>`).join("")}
      <!-- masonry courses -->
      <line x1="8" y1="76" x2="36" y2="76" stroke-width=".25"/>
      <line x1="64" y1="76" x2="92" y2="76" stroke-width=".25"/>
      <!-- glass pyramid -->
      <path d="M 30 92 L 50 44 L 70 92 Z" stroke-width=".75"/>
      <path d="M 50 44 L 50 92 M 38 80 L 62 80 M 42 70 L 58 70 M 46 58 L 54 58" stroke-width=".3" stroke-dasharray="1 1"/>
      <line x1="38" y1="80" x2="50" y2="44" stroke-width=".35"/>
      <line x1="62" y1="80" x2="50" y2="44" stroke-width=".35"/>
      <!-- pyramid base ornament -->
      <line x1="28" y1="92" x2="72" y2="92" stroke-width=".5"/>
      <circle cx="50" cy="44" r=".9" fill="${I}"/>
    </g>
    <!-- right-side hatch on right pavilion -->
    <g stroke="${I}" stroke-width=".3" opacity=".55">
      ${Array.from({length:8}).map((_,i)=>`<line x1="${85-i}" y1="${58+i*4}" x2="${92}" y2="${58+i*4}"/>`).join("")}
    </g>`,
  notredame: `
    <g stroke="${I}" fill="none" stroke-linecap="round">
      ${Array.from({length:18}).map((_,i)=>`<line x1="${10+i*4.5}" y1="93" x2="${14+i*4.5}" y2="96" stroke-width=".4"/>`).join("")}
      <line x1="6" y1="92" x2="94" y2="92" stroke-width=".8"/>
      <!-- two towers -->
      <path d="M 14 92 L 14 24 L 34 24 L 34 92" stroke-width=".75"/>
      <path d="M 66 92 L 66 24 L 86 24 L 86 92" stroke-width=".75"/>
      <!-- crenellation -->
      ${[14,18,22,26,30].map(x=>`<path d="M ${x} 24 L ${x} 20 L ${x+2.5} 20 L ${x+2.5} 24" stroke-width=".4"/>`).join("")}
      ${[66,70,74,78,82].map(x=>`<path d="M ${x} 24 L ${x} 20 L ${x+2.5} 20 L ${x+2.5} 24" stroke-width=".4"/>`).join("")}
      <!-- gothic arched openings on towers -->
      <path d="M 18 50 L 18 36 Q 18 30 24 30 Q 30 30 30 36 L 30 50" stroke-width=".5"/>
      <path d="M 70 50 L 70 36 Q 70 30 76 30 Q 82 30 82 36 L 82 50" stroke-width=".5"/>
      <line x1="24" y1="30" x2="24" y2="50" stroke-width=".25" stroke-dasharray="1 1"/>
      <line x1="76" y1="30" x2="76" y2="50" stroke-width=".25" stroke-dasharray="1 1"/>
      <path d="M 18 76 L 18 64 Q 18 58 24 58 Q 30 58 30 64 L 30 76" stroke-width=".4"/>
      <path d="M 70 76 L 70 64 Q 70 58 76 58 Q 82 58 82 64 L 82 76" stroke-width=".4"/>
      <!-- nave -->
      <path d="M 34 92 L 34 50 L 66 50 L 66 92" stroke-width=".7"/>
      <!-- gallery of kings -->
      <line x1="14" y1="48" x2="86" y2="48" stroke-width=".5"/>

      ${Array.from({length:9}).map((_,i)=>`<rect x="${17+i*7}" y="44" width="2" height="4" stroke-width=".25"/>`).join("")}

      ${[0,30,60,90,120,150].map(a=>{const r1=2.5,r2=9;const c=Math.cos(a*Math.PI/180),s=Math.sin(a*Math.PI/180);return `<line x1="${50+c*r1}" y1="${64+s*r1}" x2="${50+c*r2}" y2="${64+s*r2}" stroke-width=".35"/>`}).join("")}
      <!-- portail central -->
      <path d="M 42 92 L 42 80 Q 42 72 50 72 Q 58 72 58 80 L 58 92" stroke-width=".5"/>
      <path d="M 44 92 L 44 80 Q 44 74 50 74 Q 56 74 56 80 L 56 92" stroke-width=".35"/>
      <!-- side portails -->
      <path d="M 36 92 L 36 84 Q 36 78 40 78 Q 42 78 42 80" stroke-width=".35"/>
      <path d="M 64 92 L 64 84 Q 64 78 60 78 Q 58 78 58 80" stroke-width=".35"/>
      <!-- flèche -->
      <path d="M 47 50 L 50 18 L 53 50" stroke-width=".55"/>
      <path d="M 49 30 L 51 30 M 48 38 L 52 38 M 47.5 44 L 52.5 44" stroke-width=".3"/>
      <line x1="50" y1="18" x2="50" y2="10" stroke-width=".5"/>
      <path d="M 47 12 L 53 12 M 48 14 L 52 14" stroke-width=".35"/>
      <circle cx="50" cy="9" r="1" stroke-width=".35"/>
      <!-- flying buttresses hint -->
      <path d="M 14 70 Q 8 76 8 84" stroke-width=".35"/>
      <path d="M 86 70 Q 92 76 92 84" stroke-width=".35"/>
    </g>
    <g stroke="${I}" stroke-width=".25" opacity=".55">
      ${Array.from({length:8}).map((_,i)=>`<line x1="${68+i*1.2}" y1="${52+i*4}" x2="${66+i*1.2}" y2="${56+i*4}"/>`).join("")}
    </g>`,
  arc: `
    <g stroke="${I}" fill="none" stroke-linecap="round">
      ${Array.from({length:18}).map((_,i)=>`<line x1="${10+i*4.5}" y1="93" x2="${14+i*4.5}" y2="96" stroke-width=".4"/>`).join("")}
      <line x1="6" y1="92" x2="94" y2="92" stroke-width=".8"/>
      <!-- mass -->

      <line x1="12" y1="14" x2="88" y2="14" stroke-width=".4"/>

      <!-- relief panels (pilon) -->

      <!-- figurative hint -->

      <!-- masonry rustication courses -->
      ${[36,46,56,66,76,86].map(y=>`<line x1="14" y1="${y}" x2="36" y2="${y}" stroke-width=".25"/><line x1="64" y1="${y}" x2="86" y2="${y}" stroke-width=".25"/>`).join("")}
      <!-- top names slab -->
      <line x1="14" y1="22" x2="86" y2="22" stroke-width=".7"/>
    </g>
    <g stroke="${I}" stroke-width=".25" opacity=".5">
      ${Array.from({length:10}).map((_,i)=>`<line x1="${75+i*1}" y1="${30+i*5}" x2="${82+i*1}" y2="${30+i*5}"/>`).join("")}
    </g>`,
  vendome: `
    <g stroke="${I}" fill="none" stroke-linecap="round">
      ${Array.from({length:18}).map((_,i)=>`<line x1="${10+i*4.5}" y1="93" x2="${14+i*4.5}" y2="96" stroke-width=".4"/>`).join("")}
      <line x1="6" y1="92" x2="94" y2="92" stroke-width=".8"/>
      <!-- pedestal -->

      <line x1="30" y1="80" x2="70" y2="80" stroke-width=".5"/>
      <line x1="34" y1="84" x2="66" y2="84" stroke-width=".3" stroke-dasharray="1 1"/>

// Build a scalloped (cusped) cartouche path — like the inner border of the reference pendant.
// nLobes = number of cusps; rOuter = outer radius (lobe peak); rInner = inner radius (lobe valley).
function scallopedPath(cx, cy, rOuter, rInner, nLobes){
  const pts = [];
  const step = Math.PI / nLobes; // alternate outer/inner
  for(let i=0;i<nLobes*2;i++){
    const a = -Math.PI/2 + i*step;
    const r = (i%2===0) ? rOuter : rInner;
    pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]);
  }
  // smooth via quadratic curves through midpoints
  let d = `M ${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`;
  for(let i=1;i<=pts.length;i++){
    const p = pts[i % pts.length];
    const prev = pts[(i-1) % pts.length];
    const mx = (p[0]+prev[0])/2, my = (p[1]+prev[1])/2;
    d += ` Q ${prev[0].toFixed(2)} ${prev[1].toFixed(2)} ${mx.toFixed(2)} ${my.toFixed(2)}`;
  }
  d += " Z";
  return d;
}

function medal(m, idx){
  const upperText = m.name.toUpperCase();
  const len = upperText.length;
  const fs  = len > 22 ? 9.5 : len > 18 ? 11 : len > 14 ? 12.5 : 13.5;
  const ls  = len > 22 ? 1.6 : len > 18 ? 2.2 : 2.8;

  // Beaded rim — small gold balls around the perimeter (like ref 1)
  const beads = [];
  const N = 84;
  for(let i=0;i<N;i++){
    const a = i*(360/N)*Math.PI/180;
    const x = 110+Math.cos(a)*101.5, y = 110+Math.sin(a)*101.5;
    beads.push(`<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.7" fill="url(#hi)"/>`);
    beads.push(`<circle cx="${(x+.3).toFixed(2)}" cy="${(y+.3).toFixed(2)}" r=".7" fill="oklch(96% 0.08 88)" opacity=".9"/>`);
    beads.push(`<circle cx="${(x-.4).toFixed(2)}" cy="${(y-.4).toFixed(2)}" r=".4" fill="oklch(28% 0.07 55)" opacity=".55"/>`);
  }

  // Scalloped cartouche around the monument (8 lobes — like ref 1)
  const cartouche = scallopedPath(110, 112, 78, 68, 8);

  // Hammered/aged field — sparse irregular dots & marks
  const wear = [];
  const seed = idx*7919 + 13;
  for(let k=0;k<60;k++){
    const r = 8 + ((seed*(k+3))%82);
    const a = ((seed*13*(k+1))%3600)/10*Math.PI/180;
    const x = 110+Math.cos(a)*r, y = 110+Math.sin(a)*r;
    const rr = 0.3 + ((k*seed)%9)/12;
    const op = .15 + ((k*seed)%8)/30;
    wear.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(2)}" fill="oklch(35% 0.08 55)" opacity="${op.toFixed(2)}"/>`);
  }
  for(let k=0;k<10;k++){
    const a = ((seed*7*(k+2))%360)*Math.PI/180;
    const r = 30 + (k*6);
    const x = 110+Math.cos(a)*r, y = 110+Math.sin(a)*r;
    const dx = Math.cos(a+1)*2.5, dy = Math.sin(a+1)*2.5;
    wear.push(`<line x1="${(x-dx).toFixed(1)}" y1="${(y-dy).toFixed(1)}" x2="${(x+dx).toFixed(1)}" y2="${(y+dy).toFixed(1)}" stroke="oklch(96% 0.08 88)" stroke-width=".4" opacity=".25"/>`);
  }

  return `
  <svg class="medal" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <!-- cast shadow -->
    <ellipse cx="110" cy="212" rx="86" ry="7" fill="rgba(0,0,0,.65)"/>

    <!-- ===== ANTIQUE PENDANT (ref 1 + ref 2) =====
         outer disc · beaded rim · scalloped cartouche · hammered field      -->

    <!-- gold disc body -->
    <circle cx="110" cy="110" r="106" fill="url(#field)"/>
    <!-- soft inner field -->
    <circle cx="110" cy="110" r="100" fill="url(#field)"/>

    <!-- aged metal wear / hammered marks across whole field -->
    ${wear.join("")}

    <!-- engraved fine line just inside the beaded rim -->
    <circle cx="110" cy="110" r="95" fill="none" stroke="oklch(28% 0.07 55)" stroke-width=".5" opacity=".5"/>

    <!-- arc paths for inscription (between beaded rim and cartouche) -->
    <defs>
      <path id="topArc-${idx}" d="M 32 110 A 78 78 0 0 1 188 110" fill="none"/>
      <path id="botArc-${idx}" d="M 36 122 A 74 74 0 0 0 184 122" fill="none"/>
    </defs>

    <!-- ENGRAVED NAME (top arc) — deep shadow under, raised metal letter on top -->
    <text font-family="Cinzel, serif" font-size="${fs}" font-weight="600" letter-spacing="${ls}" transform="translate(0 .9)">
      <textPath href="#topArc-${idx}" startOffset="50%" text-anchor="middle" fill="oklch(18% 0.05 50)" opacity=".75">${upperText}</textPath>
    </text>
    <text font-family="Cinzel, serif" font-size="${fs}" font-weight="600" letter-spacing="${ls}">
      <textPath href="#topArc-${idx}" startOffset="50%" text-anchor="middle" fill="oklch(38% 0.09 60)">${upperText}</textPath>
    </text>
    <text font-family="Cinzel, serif" font-size="${fs}" font-weight="600" letter-spacing="${ls}" transform="translate(-.3 -.3)">
      <textPath href="#topArc-${idx}" startOffset="50%" text-anchor="middle" fill="oklch(96% 0.10 88)" opacity=".5">${upperText}</textPath>
    </text>

    <!-- ENGRAVED DATE (bottom arc) -->
    <text font-family="Cinzel, serif" font-size="9" font-weight="500" letter-spacing="3.4" transform="translate(0 .7)">
      <textPath href="#botArc-${idx}" startOffset="50%" text-anchor="middle" fill="oklch(18% 0.05 50)" opacity=".7">·  ${m.yr}  ·  ${m.arr}ᵉ ARR.  ·</textPath>
    </text>
    <text font-family="Cinzel, serif" font-size="9" font-weight="500" letter-spacing="3.4">
      <textPath href="#botArc-${idx}" startOffset="50%" text-anchor="middle" fill="oklch(38% 0.09 60)">·  ${m.yr}  ·  ${m.arr}ᵉ ARR.  ·</textPath>
    </text>

    <!-- BEADED RIM (signature of ref 1) -->
    ${beads.join("")}

    <!-- side fleurons (between the two arcs, on the rim's inner edge) -->
    <g fill="oklch(22% 0.06 55)">
      <g transform="translate(22 117)">
        <circle cx="0" cy="0" r="2.2"/>
        <circle cx="-5" cy="0" r="1"/>
        <circle cx="5" cy="0" r="1"/>
        <circle cx="0" cy="-5" r=".7"/>
        <circle cx="0" cy="5" r=".7"/>
      </g>
      <g transform="translate(198 117)">
        <circle cx="0" cy="0" r="2.2"/>
        <circle cx="-5" cy="0" r="1"/>
        <circle cx="5" cy="0" r="1"/>
        <circle cx="0" cy="-5" r=".7"/>
        <circle cx="0" cy="5" r=".7"/>
      </g>
    </g>

    <!-- SCALLOPED CARTOUCHE around monument (ref 1's signature lobed border) -->
    <path d="${cartouche}" fill="oklch(72% 0.13 78)" stroke="oklch(20% 0.05 50)" stroke-width="1.1"/>
    <path d="${cartouche}" fill="none" stroke="oklch(96% 0.10 88)" stroke-width=".5" opacity=".55" transform="translate(-.4 -.4)"/>
    <!-- inner cartouche shadow ring giving depth -->
    <path d="${scallopedPath(110, 112, 75, 65.5, 8)}" fill="url(#field)"/>

    <!-- tiny corner cusps decoration inside the cartouche corners (8 dots in valleys) -->
    ${Array.from({length:8}).map((_,i)=>{
      const a = -Math.PI/2 + (i+0.5)*(Math.PI/4);
      const x = 110+Math.cos(a)*60, y = 112+Math.sin(a)*60;
      return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">
        <circle r="1.1" fill="oklch(22% 0.06 55)"/>
        <circle cx="-2.5" cy="0" r=".6" fill="oklch(22% 0.06 55)"/>
        <circle cx="2.5" cy="0" r=".6" fill="oklch(22% 0.06 55)"/>
      </g>`;
    }).join("")}

    <!-- MAIN MONUMENT GLYPH — centered inside cartouche -->
    <g transform="translate(45 50) scale(1.2)" opacity=".96">
      ${glyphs[m.k]}
    </g>

    <!-- gentle raised highlight & bottom shadow for 3D coin feel -->
    <ellipse cx="78" cy="54" rx="50" ry="20" fill="oklch(98% 0.06 88 / .18)"/>
    <ellipse cx="72" cy="46" rx="24" ry="7" fill="oklch(98% 0.06 88 / .28)"/>
    <path d="M 16 140 A 98 98 0 0 0 204 140" stroke="oklch(28% 0.07 55 / .45)" stroke-width="4" fill="none"/>
    <path d="M 22 86 A 94 94 0 0 1 198 86" stroke="oklch(96% 0.08 88 / .35)" stroke-width="1.5" fill="none"/>
  </svg>`;
}

const grid = document.getElementById("grid");
monuments.forEach((m,i)=>{
  const cell = document.createElement("article");
  cell.className = "cell";
  cell.innerHTML = `
    <span class="tick tl"></span><span class="tick tr"></span>
    <span class="tick bl"></span><span class="tick br"></span>
    <div class="id">№ ${m.id}</div>
    <div class="arr">${m.arr}ᵉ</div>
    <div class="stage">${medal(m, i)}</div>
    <div class="label">
      <p class="name">${m.name}</p>
      <div class="sub"><b>${m.yr}</b> · ${m.arr}ᵉ ARR.</div>
    </div>`;
  grid.appendChild(cell);
});
