<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urbink — V1 variations couleur par quartier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0D1117; font-family: 'Inter', sans-serif; overflow: hidden; color: #E2E8F0; }
#root { width: 100vw; height: 100vh; }
::-webkit-scrollbar { display: none; }
* { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="js/ParisData.jsx"></script>
<script type="text/babel" src="js/ZonesOverlay.jsx"></script>
<script type="text/babel" src="js/V1Variants.jsx"></script>

<script type="text/babel">
'use strict';

const PhoneFrame = ({children}) => (
  <div style={{
    width: 390, height: 680, position: 'relative',
    background: '#F8FAFC', borderRadius: 38,
    boxShadow: '0 1px 0 rgba(255,255,255,.06) inset, 0 30px 60px -10px rgba(0,0,0,.45), 0 0 0 10px #18181B, 0 0 0 11px #2A2A30',
    overflow: 'hidden', fontFamily: 'Inter, sans-serif',
  }}>
    <div style={{position:'absolute',top:10,left:'50%',transform:'translateX(-50%)',width:110,height:32,background:'#000',borderRadius:20,zIndex:200}}/>
    <div style={{position:'absolute',top:0,left:0,right:0,height:48,display:'flex',alignItems:'flex-end',justifyContent:'space-between',padding:'0 26px 6px',zIndex:100,color:'#0F172A'}}>
      <span style={{fontSize:14,fontWeight:600}}>9:41</span>
      <div style={{display:'flex',alignItems:'center',gap:5}}>
        <span style={{fontSize:10,fontWeight:600}}>•••• 5G</span>
        <div style={{width:22,height:11,borderRadius:3,border:'1.3px solid #0F172A',position:'relative'}}>
          <div style={{position:'absolute',inset:1,borderRadius:1,background:'#0F172A',width:13}}/>
        </div>
      </div>
    </div>
    {children}
    <div style={{position:'absolute',left:0,right:0,bottom:0,height:66,background:'#fff',borderTop:'1px solid #E2E8F0',display:'flex',alignItems:'center',justifyContent:'space-around',zIndex:50,paddingBottom:12}}>
      {['Carte','Parcours','Social','Badges','Profil'].map((l,i)=>(
        <div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
          <div style={{width:20,height:20,borderRadius:5,background:i===0?'#256F4C':'#CBD5E1'}}/>
          <span style={{fontSize:9,fontWeight:i===0?600:500,color:i===0?'#256F4C':'#64748B'}}>{l}</span>
        </div>
      ))}
    </div>
    <div style={{position:'absolute',bottom:6,left:'50%',transform:'translateX(-50%)',width:120,height:4,background:'#0F172A',borderRadius:2,zIndex:60}}/>
  </div>
);

const ZonesPill = ({mode='Arr.'}) => (
  <div style={{
    position:'absolute', left:16, top:58,
    display:'inline-flex',alignItems:'center',gap:6,
    background:'#fff', borderRadius:20, padding:'7px 12px 7px 10px',
    boxShadow:'0 2px 12px rgba(0,0,0,.12)',
    fontSize:11, fontWeight:600, color:'#0F172A', zIndex:40,
    border:'1px solid #E2E8F0',
  }}>
    <div style={{width:7,height:7,background:'#256F4C',borderRadius:'50%'}}/>
    Zones · {mode}
  </div>
);

const CityPill = () => (
  <div style={{
    position:'absolute', right:16, top:58,
    display:'inline-flex',alignItems:'center',gap:5,
    background:'rgba(255,255,255,.95)', borderRadius:20, padding:'7px 10px 7px 8px',
    boxShadow:'0 2px 12px rgba(0,0,0,.12)',
    fontSize:11, fontWeight:600, color:'#256F4C', zIndex:40,
    border:'1px solid #E2E8F0',
  }}>
    <span style={{fontSize:12}}>🇫🇷</span>
    Paris
    <svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M19 9l-7 7-7-7" stroke="#256F4C" strokeWidth="2.5" strokeLinecap="round"/></svg>
  </div>
);

// Tiny legend explaining opacity ramp
const OpacityLegend = ({paletteSample}) => (
  <div style={{
    position:'absolute', left:12, right:12, bottom:82,
    background:'rgba(255,255,255,.92)', backdropFilter:'blur(10px)',
    borderRadius:14, padding:'10px 14px',
    boxShadow:'0 4px 16px rgba(0,0,0,.10)', zIndex:45,
    fontSize:10, fontWeight:500, color:'#64748B',
    border:'1px solid rgba(226,232,240,.8)',
  }}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
      <span style={{color:'#0F172A',fontWeight:700,fontSize:11}}>Opacité = progression</span>
      <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:9}}>0% ─► 100%</span>
    </div>
    <div style={{display:'flex',gap:2,height:10,borderRadius:4,overflow:'hidden'}}>
      {[0,15,30,45,60,75,90,100].map((p,i)=>(
        <div key={i} style={{
          flex:1, background: paletteSample,
          opacity: 0.08 + (p/100)*0.47,
        }}/>
      ))}
    </div>
  </div>
);

const VariantCard = ({zoom, palette, dashStyle, labelStyle, strokeMode, zoomLabel, sampleColor}) => (
  <div style={{position:'relative',width:390,height:680}}>
    <PhoneFrame>
      <div style={{position:'absolute',top:48,left:0,right:0,bottom:66,overflow:'hidden'}}>
        <window.MapShell zoom={zoom}>
          <window.V1PerArr zoom={zoom} palette={palette}
            dashStyle={dashStyle} labelStyle={labelStyle} strokeMode={strokeMode}/>
        </window.MapShell>
      </div>
      <ZonesPill mode={zoom==='far'?'Arr.':'Quartier'}/>
      <CityPill/>
      <div style={{
        position:'absolute', right:16, bottom:82, zIndex:46,
        background:'#0F172A', color:'#fff', borderRadius:10,
        padding:'6px 10px', fontSize:10, fontWeight:600,
        fontFamily:'JetBrains Mono, monospace', letterSpacing:.5,
        boxShadow:'0 4px 12px rgba(0,0,0,.3)',
      }}>
        {zoomLabel}
      </div>
      <OpacityLegend paletteSample={sampleColor}/>
    </PhoneFrame>
  </div>
);

// Variants — 4 flavors × 2 zoom levels
const V1_VARIANTS = [
  {
    id:'metro-dashed',
    title:'V1-A · Métro, pointillé',
    subtitle:'Palette métro de Paris · bordures dashed · numéros discrets',
    palette: window.METRO_PALETTE, dashStyle:'dashed',
    labelStyle:'muted', strokeMode:'border',
    sampleColor:'#C04191',
  },
  {
    id:'earthy-solid',
    title:'V1-B · Cartographique earthy',
    subtitle:'Tons terreux feutrés · contour plein · label Inter',
    palette: window.EARTHY_PALETTE, dashStyle:'solid',
    labelStyle:'plain', strokeMode:'border',
    sampleColor:'#6B8E5A',
  },
  {
    id:'seasonal-pill',
    title:'V1-C · Saisonnier, pastilles',
    subtitle:'Teintes printanières low-sat · pastille blanche · contraste doux',
    palette: window.SEASONAL_PALETTE, dashStyle:'dotted',
    labelStyle:'pill', strokeMode:'border',
    sampleColor:'#8DD1C6',
  },
  {
    id:'metro-serif',
    title:'V1-D · Métro, médaillons serif',
    subtitle:'Palette métro · médaillons Crimson Pro · feel carte touristique',
    palette: window.METRO_PALETTE, dashStyle:'solid',
    labelStyle:'serif', strokeMode:'border',
    sampleColor:'#62259D',
  },
];

const App = () => {
  const { DesignCanvas, DCSection, DCArtboard } = window;
  return (
    <DesignCanvas
      title="Urbink — V1 déclinaisons couleur"
      subtitle="Chaque arrondissement/quartier = une couleur · opacité = % rues parcourues (cap à 55% pour rester transparent)"
    >
      <DCSection id="far" title="Dézoomé · arrondissements (20 couleurs)"
        subtitle="L'opacité monte avec la progression, mais on voit toujours la carte OSM dessous">
        {V1_VARIANTS.map(v => (
          <DCArtboard key={v.id+'-far'} id={v.id+'-far'} label={v.title} width={390} height={700}>
            <VariantCard zoom="far" {...v} zoomLabel="ZOOM 11 · ARR."/>
          </DCArtboard>
        ))}
      </DCSection>

      <DCSection id="near" title="Zoomé · quartiers (4e arr.)"
        subtitle="Les 4 quartiers du 4e héritent d'une sous-sélection de la palette">
        {V1_VARIANTS.map(v => (
          <DCArtboard key={v.id+'-near'} id={v.id+'-near'} label={v.title+' · zoom'} width={390} height={700}>
            <VariantCard zoom="near" {...v} zoomLabel="ZOOM 14 · QUARTIER"/>
          </DCArtboard>
        ))}
      </DCSection>
    </DesignCanvas>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
